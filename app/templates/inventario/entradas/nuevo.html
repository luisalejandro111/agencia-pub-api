<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Entrada - Inventario</title>
    <link rel="icon" type="image/x-icon" href="/static/logo2.ico">
    <link rel="shortcut icon" href="/static/logo2.ico">
    <link rel="stylesheet" href="/static/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .card-hover { transition: transform 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); }
        .input-error { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1) !important; }
        .input-valid { border-color: #10b981 !important; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1) !important; }
        .talla-row {
            transition: all 0.2s ease;
        }
        .talla-row:hover {
            background-color: #f8fafc;
        }
        .badge-talla {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 9999px;
        }
        .badge-talla-stock {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-talla-low {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-talla-out {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        
        <!-- Navegación -->
        <nav class="flex text-gray-500 text-xs mb-4 uppercase tracking-wider font-semibold">
            <a href="/dashboard" class="hover:text-indigo-600">Dashboard</a>
            <span class="mx-2">/</span>
            <a href="/inventario/entradas/" class="hover:text-indigo-600">Entradas</a>
            <span class="mx-2">/</span>
            <span class="text-gray-800">Nueva Entrada</span>
        </nav>

        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
                    <i class="fas fa-arrow-down text-green-600 mr-3"></i>Nueva Entrada
                </h1>
                <p class="text-slate-500 mt-1">Registrar compra de materiales</p>
            </div>
        </div>

        <!-- Mensajes -->
        {% if error %}
        <div class="mb-6 p-4 bg-red-50 text-red-700 rounded-lg border border-red-200 flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" action="/inventario/entradas/crear" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Material -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Material *</label>
                    <select name="material_id" id="materialSelect"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                            required onchange="actualizarUnidadMedida(); cargarTallas()">
                        <option value="">Seleccionar material</option>
                        {% for material in materiales %}
                        <option value="{{ material.id }}" 
                                data-unidad="{{ material.unidad_medida }}"
                                data-m2porunidad="{{ material.m2_por_unidad }}"
                                data-nombre="{{ material.nombre }}"
                                data-tallas="{{ material.tallas if material.tallas else '{}' }}">
                            {{ material.codigo }} - {{ material.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Proveedor -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Proveedor</label>
                    <select name="proveedor_id" 
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition">
                        <option value="">Sin proveedor</option>
                        {% for proveedor in proveedores %}
                        <option value="{{ proveedor.id }}">{{ proveedor.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- ============================================ -->
                <!-- SECCIÓN DINÁMICA SEGÚN UNIDAD DE MEDIDA     -->
                <!-- ============================================ -->
                <div id="seccionCantidad" class="md:col-span-2">
                    <div class="text-gray-500">Seleccione un material primero</div>
                </div>
                
                <!-- ============================================ -->
                <!-- 🔥 SECCIÓN DE TALLAS (NUEVA)                -->
                <!-- ============================================ -->
                <div id="seccionTallas" class="md:col-span-2 hidden">
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
                        <h4 class="text-sm font-bold text-emerald-800 mb-3 flex items-center gap-2">
                            <i class="fas fa-tshirt text-emerald-600"></i>
                            Stock por Talla
                            <span class="text-xs font-normal text-emerald-600 ml-2">(Ingresa las cantidades por talla)</span>
                        </h4>
                        <div id="contenedorTallas" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                            <!-- Las tallas se cargan dinámicamente con JavaScript -->
                        </div>
                        <p class="text-xs text-emerald-700 mt-3">
                            <i class="fas fa-info-circle"></i> 
                            La cantidad total se sumará automáticamente
                        </p>
                    </div>
                </div>
                
                <!-- Número de factura -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Número de Factura</label>
                    <input type="text" name="numero_factura" 
                           placeholder="Ej: F001-000123"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                
                <!-- Observaciones -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Observaciones</label>
                    <textarea name="observaciones" rows="3" 
                              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                              placeholder="Notas sobre la entrada..."></textarea>
                </div>
            </div>
            
            <!-- Botones -->
            <div class="flex flex-col sm:flex-row gap-3 mt-6">
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-md transition flex items-center justify-center">
                    <i class="fas fa-save mr-2"></i> Registrar Entrada
                </button>
                <a href="/inventario/entradas/" class="bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-6 py-2.5 rounded-lg text-sm font-bold shadow-sm transition text-center">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

<script>
// ============================================
// 1. ACTUALIZAR UNIDAD DE MEDIDA
// ============================================
function actualizarUnidadMedida() {
    const select = document.querySelector('select[name="material_id"]');
    const seccionCantidad = document.getElementById('seccionCantidad');
    const selectedOption = select.options[select.selectedIndex];
    
    if (!selectedOption.value) {
        seccionCantidad.innerHTML = '<div class="text-gray-500">Seleccione un material primero</div>';
        return;
    }
    
    const unidad = selectedOption.getAttribute('data-unidad');
    const m2PorUnidad = parseFloat(selectedOption.getAttribute('data-m2porunidad')) || 1.0;
    
    if (unidad === 'rollos' || unidad === 'unidades') {
        // Formulario para materiales que se compran en rollos/unidades
        seccionCantidad.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Cantidad de ${unidad}</label>
                    <input type="number" step="0.01" id="cantidad_unidades" 
                           placeholder="Ej: 2" 
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                           oninput="calcularMetrosCuadrados(${m2PorUnidad})" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">M² por ${unidad}</label>
                    <input type="number" step="0.01" id="m2_por_unidad" 
                           value="${m2PorUnidad}" readonly
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Total m² (se guardará)</label>
                    <input type="number" step="0.01" name="cantidad" id="total_m2" 
                           placeholder="0.00" 
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition bg-green-50"
                           readonly required>
                    <p class="text-xs text-gray-500 mt-1">Este es el valor que se registrará en inventario</p>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Precio de Compra ($)*</label>
                    <input type="number" step="0.01" name="precio_compra" 
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                           required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Precio de Venta ($)*</label>
                    <input type="number" step="0.01" name="precio_venta" 
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                           required>
                </div>
            </div>
        `;
    } else {
        // Formulario para otras unidades (m², litros, etc.)
        seccionCantidad.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Cantidad (${unidad})*</label>
                    <input type="number" step="0.01" name="cantidad" 
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                           required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Precio de Compra ($)*</label>
                    <input type="number" step="0.01" name="precio_compra" 
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                           required>
                </div>
            </div>
        `;
    }
}

function calcularMetrosCuadrados(m2PorUnidad) {
    const cantidadUnidades = parseFloat(document.getElementById('cantidad_unidades').value) || 0;
    const totalM2 = cantidadUnidades * m2PorUnidad;
    document.getElementById('total_m2').value = totalM2.toFixed(2);
}

// ============================================
// 2. 🔥 CARGAR TALLAS DEL MATERIAL
// ============================================
function cargarTallas() {
    const select = document.querySelector('select[name="material_id"]');
    const selectedOption = select.options[select.selectedIndex];
    const seccionTallas = document.getElementById('seccionTallas');
    const contenedor = document.getElementById('contenedorTallas');
    
    // Ocultar sección de tallas si no hay material seleccionado
    if (!selectedOption.value) {
        seccionTallas.classList.add('hidden');
        return;
    }
    
    // Obtener tallas del atributo data-tallas (JSON string)
    let tallasData = {};
    try {
        const tallasStr = selectedOption.getAttribute('data-tallas');
        if (tallasStr && tallasStr !== '{}' && tallasStr !== 'null') {
            tallasData = JSON.parse(tallasStr);
        }
    } catch (e) {
        tallasData = {};
    }
    
    // Si no hay tallas, ocultar la sección
    if (Object.keys(tallasData).length === 0) {
        seccionTallas.classList.add('hidden');
        return;
    }
    
    // Mostrar sección de tallas
    seccionTallas.classList.remove('hidden');
    
    // Generar inputs para cada talla
    let html = '';
    for (const [talla, stockActual] of Object.entries(tallasData)) {
        html += `
            <div class="bg-white rounded-lg border border-emerald-200 p-3 text-center">
                <label class="block text-xs font-bold text-emerald-700 uppercase">{{ talla }}</label>
                <input type="number" 
                       name="tallas[${talla}]" 
                       placeholder="0"
                       min="0"
                       step="1"
                       value="0"
                       class="w-full mt-1 px-2 py-1.5 border border-gray-300 rounded-lg text-center text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                       onchange="actualizarTotalTallas()">
                <span class="text-[10px] text-slate-400">Stock: ${stockActual}</span>
            </div>
        `;
    }
    
    contenedor.innerHTML = html;
    
    // Agregar campo de total al final
    contenedor.innerHTML += `
        <div class="bg-emerald-100 rounded-lg border border-emerald-300 p-3 text-center col-span-2">
            <label class="block text-xs font-bold text-emerald-800 uppercase">Total</label>
            <input type="text" 
                   id="totalTallasInput" 
                   readonly
                   value="0"
                   class="w-full mt-1 px-2 py-1.5 border border-emerald-300 rounded-lg text-center text-sm font-bold bg-emerald-50 text-emerald-800">
            <span class="text-[10px] text-emerald-600">Suma de todas las tallas</span>
            <input type="hidden" name="cantidad_tallas_total" id="cantidadTallasTotal" value="0">
        </div>
    `;
}

// ============================================
// 3. ACTUALIZAR TOTAL DE TALLAS
// ============================================
function actualizarTotalTallas() {
    const inputs = document.querySelectorAll('input[name^="tallas["]');
    let total = 0;
    inputs.forEach(input => {
        const val = parseFloat(input.value) || 0;
        if (val > 0) total += val;
    });
    
    const totalInput = document.getElementById('totalTallasInput');
    const hiddenInput = document.getElementById('cantidadTallasTotal');
    if (totalInput) totalInput.value = total;
    if (hiddenInput) hiddenInput.value = total;
}

// ============================================
// 4. INICIALIZAR
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    const select = document.querySelector('select[name="material_id"]');
    if (select && select.value) {
        actualizarUnidadMedida();
        cargarTallas();
    }
});
</script>
</body>
</html>
