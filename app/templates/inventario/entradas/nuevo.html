<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Entrada - Inventario</title>
    <link rel="icon" type="image/x-icon" href="/static/logo2.ico">
    <link rel="shortcut icon" href="/static/logo2.ico">
    <link rel="stylesheet" href="/static/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .talla-row {
            transition: all 0.2s ease;
        }
        .talla-row:hover {
            background-color: #f8fafc;
        }
        .talla-preset-btn {
            transition: all 0.2s ease;
        }
        .talla-preset-btn:hover {
            transform: scale(1.05);
        }
        .badge-opcional {
            background: #94a3b8;
            color: white;
            font-size: 0.65rem;
            padding: 0.1rem 0.4rem;
            border-radius: 9999px;
            font-weight: 600;
            margin-left: 0.25rem;
        }
        .badge-stock {
            font-size: 0.7rem;
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            font-weight: 600;
        }
        .badge-stock-positive {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-stock-zero {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        
        <!-- Navegación -->
        <nav class="flex text-gray-500 text-xs mb-4 uppercase tracking-wider font-semibold">
            <a href="/dashboard" class="hover:text-indigo-600">Dashboard</a>
            <span class="mx-2">/</span>
            <a href="/inventario/entradas/" class="hover:text-indigo-600">Entradas</a>
            <span class="mx-2">/</span>
            <span class="text-gray-800">Nueva Entrada</span>
        </nav>

        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
                    <i class="fas fa-arrow-down text-green-600 mr-3"></i>Nueva Entrada
                </h1>
                <p class="text-slate-500 mt-1">Registrar compra de materiales</p>
            </div>
        </div>

        <!-- Mensajes -->
        {% if error %}
        <div class="mb-6 p-4 bg-red-50 text-red-700 rounded-lg border border-red-200 flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" action="/inventario/entradas/crear" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Material -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Material *</label>
                    <select name="material_id" id="materialSelect"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                            required onchange="actualizarUnidadMedida(); cargarTallas()">
                        <option value="">Seleccionar material</option>
                        {% for material in materiales %}
                        <option value="{{ material.id }}" 
                                data-unidad="{{ material.unidad_medida }}"
                                data-tallas='{{ material.tallas|tojson|safe if material.tallas else "{}" }}'>
                            {{ material.codigo }} - {{ material.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Proveedor -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Proveedor</label>
                    <select name="proveedor_id" 
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition">
                        <option value="">Sin proveedor</option>
                        {% for proveedor in proveedores %}
                        <option value="{{ proveedor.id }}">{{ proveedor.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- ============================================ -->
                <!-- 🔥 CANTIDAD CON UNIDAD DE MEDIDA DEL MATERIAL -->
                <!-- ============================================ -->
                <div id="seccionCantidad" class="md:col-span-2">
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <label class="block text-sm font-medium text-gray-700 mb-2" id="labelCantidad">
                            Cantidad <span class="text-xs text-slate-500 font-normal">(seleccione un material)</span>
                        </label>
                        <input type="number" step="0.01" name="cantidad" id="cantidadInput"
                               placeholder="0.00" 
                               class="w-full px-4 py-3 border-2 border-indigo-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition font-bold text-lg"
                               required>
                        <p class="text-xs text-slate-500 mt-1">
                            <i class="fas fa-info-circle"></i> 
                            Ingresa la cantidad en la unidad de medida del material seleccionado
                        </p>
                    </div>
                </div>
                
                <!-- ============================================ -->
                <!-- 🔥 SECCIÓN DE TALLAS (SOLO CUANDO SE QUIERA) -->
                <!-- ============================================ -->
                <div id="seccionTallas" class="md:col-span-2 hidden">
                    <div class="mt-4 border-t border-slate-200 pt-4">
                        <h4 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2 mb-4">
                            <i class="fas fa-tshirt text-emerald-500"></i>
                            Tallas y Cantidades
                            <span class="badge-opcional">OPCIONAL</span>
                        </h4>

                        <!-- 🔥 BOTONES -->
                        <div class="flex flex-wrap gap-2 mb-4">
                            <button type="button" onclick="cargarTallasPredefinidas()" 
                                    class="talla-preset-btn text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg border border-emerald-700 font-medium shadow-sm">
                                <i class="fas fa-tshirt mr-1"></i> Cargar tallas (2-18, S-XXL)
                            </button>
                            
                            <button type="button" onclick="agregarTallaPersonalizada()" 
                                    class="talla-preset-btn text-xs bg-indigo-100 hover:bg-indigo-200 px-4 py-2 rounded-lg border border-indigo-300 font-medium text-indigo-700">
                                <i class="fas fa-plus-circle mr-1"></i> Agregar talla
                            </button>
                            
                            <button type="button" onclick="limpiarTodasTallas()" 
                                    class="talla-preset-btn text-xs bg-red-100 hover:bg-red-200 px-4 py-2 rounded-lg border border-red-300 font-medium text-red-600">
                                <i class="fas fa-trash mr-1"></i> Limpiar todo
                            </button>
                        </div>

                        <!-- Tabla de tallas -->
                        <div class="overflow-x-auto border border-slate-200 rounded-xl">
                            <table class="w-full text-sm">
                                <thead class="bg-slate-100">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider">Talla</th>
                                        <th class="px-4 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider">Cantidad</th>
                                        <th class="px-4 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider">Stock actual</th>
                                        <th class="px-4 py-3 text-center text-xs font-bold text-slate-600 uppercase tracking-wider w-12">Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tallasContainer">
                                    <!-- Las filas se agregan dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Resumen de totales -->
                        <div class="mt-3 flex justify-end">
                            <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-2">
                                <span class="text-sm font-semibold text-emerald-800">
                                    Total de unidades: <span id="totalCantidadTallas" class="text-lg font-bold">0</span>
                                </span>
                                <input type="hidden" name="cantidad_tallas_total" id="cantidadTallasTotal" value="0">
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Precios -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Precio de Compra ($)*</label>
                    <input type="number" step="0.01" name="precio_compra" 
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                           required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Precio de Venta ($)*</label>
                    <input type="number" step="0.01" name="precio_venta" 
                           placeholder="0.00"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                           required>
                </div>
                
                <!-- Número de factura -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Número de Factura</label>
                    <input type="text" name="numero_factura" 
                           placeholder="Ej: F001-000123"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                
                <!-- Observaciones -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Observaciones</label>
                    <textarea name="observaciones" rows="2" 
                              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition"
                              placeholder="Notas sobre la entrada..."></textarea>
                </div>
            </div>
            
            <!-- Botones -->
            <div class="flex flex-col sm:flex-row gap-3 mt-6 border-t border-slate-200 pt-6">
                <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold shadow-md transition flex items-center justify-center">
                    <i class="fas fa-save mr-2"></i> Registrar Entrada
                </button>
                <a href="/inventario/entradas/" class="bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-6 py-3 rounded-lg text-sm font-bold shadow-sm transition text-center">
                    <i class="fas fa-times mr-2"></i> Cancelar
                </a>
            </div>
        </form>
    </div>

<script>
// ============================================
// 🔥 ACTUALIZAR UNIDAD DE MEDIDA
// ============================================
function actualizarUnidadMedida() {
    const select = document.querySelector('select[name="material_id"]');
    const selectedOption = select.options[select.selectedIndex];
    const labelCantidad = document.getElementById('labelCantidad');
    const cantidadInput = document.getElementById('cantidadInput');
    const seccionTallas = document.getElementById('seccionTallas');
    
    if (!selectedOption.value) {
        labelCantidad.innerHTML = 'Cantidad <span class="text-xs text-slate-500 font-normal">(seleccione un material)</span>';
        cantidadInput.placeholder = '0.00';
        seccionTallas.classList.add('hidden');
        return;
    }
    
    const unidad = selectedOption.getAttribute('data-unidad') || 'unidades';
    
    // Actualizar el label con la unidad de medida
    const unidadDisplay = {
        'unidades': 'unidades',
        'm²': 'metros cuadrados (m²)',
        'metros': 'metros lineales',
        'kilos': 'kilos (kg)',
        'litros': 'litros (L)',
        'minutos': 'minutos',
        'rollos': 'rollos'
    }[unidad] || unidad;
    
    labelCantidad.innerHTML = `Cantidad (${unidadDisplay}) <span class="text-xs text-slate-500 font-normal">*</span>`;
    cantidadInput.placeholder = `0.00 ${unidad}`;
}

// ============================================
// 🔥 FUNCIONES PARA TALLAS
// ============================================

// Tallas predefinidas
const TALLAS_PREDEFINIDAS = ['2', '4', '6', '8', '10', '12', '14', '16', '18', 'S', 'M', 'L', 'XL'];

// Stock actual de cada talla (se carga del material seleccionado)
let stockActualTallas = {};

// Cargar tallas al seleccionar un material
function cargarTallas() {
    const select = document.querySelector('select[name="material_id"]');
    const selectedOption = select.options[select.selectedIndex];
    const seccionTallas = document.getElementById('seccionTallas');
    
    if (!selectedOption.value) {
        seccionTallas.classList.add('hidden');
        stockActualTallas = {};
        return;
    }
    
    // Obtener tallas del material seleccionado
    try {
        const tallasStr = selectedOption.getAttribute('data-tallas');
        if (tallasStr && tallasStr !== '{}' && tallasStr !== 'null') {
            stockActualTallas = JSON.parse(tallasStr);
        } else {
            stockActualTallas = {};
        }
    } catch (e) {
        stockActualTallas = {};
    }
    
    // Si el material tiene tallas, mostrar la sección
    if (Object.keys(stockActualTallas).length > 0) {
        seccionTallas.classList.remove('hidden');
        // Cargar las tallas predefinidas automáticamente
        cargarTallasPredefinidas();
    } else {
        seccionTallas.classList.add('hidden');
    }
}

// Cargar todas las tallas predefinidas
function cargarTallasPredefinidas() {
    const container = document.getElementById('tallasContainer');
    
    // Limpiar container
    container.innerHTML = '';
    
    // Agregar cada talla con cantidad 0 y su stock actual
    TALLAS_PREDEFINIDAS.forEach(talla => {
        const stock = stockActualTallas[talla] || 0;
        agregarFilaTalla(talla, 0, stock);
    });
    
    // Actualizar total
    actualizarTotalTallas();
}

// Agregar una talla personalizada
function agregarTallaPersonalizada() {
    const talla = prompt('Ingresa la talla a agregar (ej: XS, XXL, 3, 5, etc.):');
    if (!talla || talla.trim() === '') return;
    
    const tallaTrim = talla.trim().toUpperCase();
    
    // Verificar si ya existe
    const container = document.getElementById('tallasContainer');
    const filas = container.querySelectorAll('tr');
    for (let fila of filas) {
        const input = fila.querySelector('input[name="tallas[]"]');
        if (input && input.value.toUpperCase() === tallaTrim) {
            alert(`La talla "${tallaTrim}" ya existe.`);
            return;
        }
    }
    
    // Agregar fila con stock 0 (no se conoce)
    agregarFilaTalla(tallaTrim, 0, 0);
    actualizarTotalTallas();
}

// Agregar una fila a la tabla
function agregarFilaTalla(talla, cantidad, stock) {
    const container = document.getElementById('tallasContainer');
    
    const row = document.createElement('tr');
    row.className = 'talla-row border-t border-slate-200 hover:bg-slate-50';
    
    // Badge de stock
    const badgeClass = stock > 0 ? 'badge-stock-positive' : 'badge-stock-zero';
    const badgeText = stock > 0 ? `${stock} unidades` : 'Sin stock';
    
    row.innerHTML = `
        <td class="px-4 py-2">
            <input type="text" name="tallas[]" value="${talla}" readonly
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 font-medium text-slate-700">
        </td>
        <td class="px-4 py-2">
            <input type="number" name="tallas_cantidad[]" placeholder="0" 
                   value="${cantidad}"
                   min="0"
                   step="1"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                   onchange="actualizarTotalTallas()"
                   onkeyup="actualizarTotalTallas()">
        </td>
        <td class="px-4 py-2">
            <span class="badge-stock ${badgeClass}">${badgeText}</span>
        </td>
        <td class="px-4 py-2 text-center">
            <button type="button" onclick="eliminarFilaTalla(this)" 
                    class="text-red-400 hover:text-red-700 p-1 rounded-full hover:bg-red-50 transition">
                <i class="fas fa-times-circle text-lg"></i>
            </button>
        </td>
    `;
    
    container.appendChild(row);
}

// Limpiar todas las tallas
function limpiarTodasTallas() {
    if (confirm('¿Eliminar todas las tallas?')) {
        const container = document.getElementById('tallasContainer');
        container.innerHTML = '';
        actualizarTotalTallas();
    }
}

// Eliminar una fila de talla
function eliminarFilaTalla(btn) {
    const row = btn.closest('tr');
    const container = document.getElementById('tallasContainer');
    
    if (container.children.length > 1) {
        row.remove();
        actualizarTotalTallas();
    } else {
        // Si es la única, solo limpiar la cantidad
        const cantidadInput = row.querySelector('input[name="tallas_cantidad[]"]');
        if (cantidadInput) cantidadInput.value = '0';
        actualizarTotalTallas();
    }
}

// ============================================
// ACTUALIZAR TOTAL DE TALLAS
// ============================================
function actualizarTotalTallas() {
    const inputs = document.querySelectorAll('input[name="tallas_cantidad[]"]');
    let total = 0;
    inputs.forEach(input => {
        const val = parseFloat(input.value) || 0;
        if (val > 0) total += val;
    });
    
    // Actualizar el total en el badge
    const totalSpan = document.getElementById('totalCantidadTallas');
    const hiddenInput = document.getElementById('cantidadTallasTotal');
    
    if (totalSpan) totalSpan.textContent = total;
    if (hiddenInput) hiddenInput.value = total;
}

// ============================================
// INICIALIZAR
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    const select = document.querySelector('select[name="material_id"]');
    if (select && select.value) {
        actualizarUnidadMedida();
        cargarTallas();
    }
});
</script>
</body>
</html>
