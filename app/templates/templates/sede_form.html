<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Editar' if sede else 'Nueva' }} Sede</title>
    <link rel="stylesheet" href="/static/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-3xl mx-auto p-6">
        
        <nav class="flex text-gray-500 text-xs mb-4 uppercase tracking-wider font-semibold">
            <a href="/dashboard" class="hover:text-indigo-600">Dashboard</a>
            <span class="mx-2">/</span>
            <a href="/config/sedes" class="hover:text-indigo-600">Sedes</a>
            <span class="mx-2">/</span>
            <span class="text-gray-800">{{ 'Editar' if sede else 'Nueva' }}</span>
        </nav>

        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-6">
            <i class="fas fa-building text-indigo-600 mr-3"></i>
            {{ 'Editar Sede' if sede else 'Nueva Sede' }}
        </h1>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 text-red-700 rounded-lg border border-red-200 text-sm font-semibold">
            <i class="fas fa-exclamation-circle mr-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" 
              action="{{ '/config/sedes/' ~ sede.id ~ '/editar' if sede else '/config/sedes/crear' }}"
              class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-5">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Nombre de la Sede <span class="text-red-500 font-bold">*</span>
                </label>
                <input type="text" name="nombre" value="{{ sede.nombre if sede else '' }}" required
                       placeholder="Ej: Sede Norte, Sucursal Valencia"
                       class="w-full px-4 py-3 border-2 border-indigo-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-semibold">
            </div>

            {% if not sede %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Código <span class="text-xs text-slate-400">(opcional, se auto-genera)</span>
                </label>
                <input type="text" name="codigo" placeholder="Ej: NORTE (vacío = automático)"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            {% endif %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Encargado</label>
                    <input type="text" name="encargado" value="{{ sede.encargado if sede else '' }}"
                           placeholder="Nombre del responsable"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                    <input type="text" name="telefono" value="{{ sede.telefono if sede else '' }}"
                           placeholder="Ej: 0241-555-1234"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Dirección</label>
                <input type="text" name="direccion" value="{{ sede.direccion if sede else '' }}"
                       placeholder="Dirección completa de la sede"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" name="email" value="{{ sede.email if sede else '' }}"
                       placeholder="sede@empresa.com"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex gap-3 pt-4 border-t border-slate-200">
                <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold shadow-md transition">
                    <i class="fas fa-save mr-2"></i>{{ 'Guardar Cambios' if sede else 'Crear Sede' }}
                </button>
                <a href="/config/sedes" class="bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-6 py-3 rounded-lg font-bold shadow-sm transition text-center">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</body>
</html>
